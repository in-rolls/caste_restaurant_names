[project]
name = "naan-significant"
version = "0.1.0"
description = "Collection and adjudication tools for restaurant-name research"
requires-python = ">=3.12"
dependencies = ["googlemaps>=4.10", "requests>=2.31", "pyshp>=2.3"]

[dependency-groups]
dev = ["black", "isort", "flake8", "Flake8-pyproject", "pytest"]

[tool.uv]
package = false

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["scripts"]

[tool.codespell]
builtin = "clear,rare,en-GB_to_en-US"
skip = "*.pdf,*.png,*.jpg,*.jpeg,*.gif,*.csv,*.tsv,*.json,*.geojson,*.graphml,*.ipynb,*.html,*.svg,*.bib,*.bbl,*.lock,*.parquet,*.rda,*.rds,*.RData,*.dta,*.xlsx,*.xml,*.min.js,*.map,*.log,*.aux,./data,./renv"
ignore-words-list = "colour,summarise"
